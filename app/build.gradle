plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 读取签名配置（keystore.properties 与 discuz-novel.keystore 位于工程根目录，勿外传）
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.discuz.novel'
    compileSdk 34

    defaultConfig {
        applicationId "www.soushu2030.com"
        minSdk 21
        targetSdk 34
        versionCode 87
        versionName "2.6.0"
    }

    signingConfigs {
        release {
            storeFile rootProject.file(keystoreProperties['storeFile'] ?: 'discuz-novel.keystore')
            storePassword keystoreProperties['storePassword']
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            // 签名方案加固：同时启用 v1(JAR) + v2 + v3，最大化兼容性与安全性
            enableV1Signing = true
            enableV2Signing = true
            enableV3Signing = true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
